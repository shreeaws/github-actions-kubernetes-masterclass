name: CI pipeline

on:
    push:
        branches: [main]                          # Trigger the workflow on pushes to the main branch


jobs:
    build_push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4                # Check out the repository code to the runner
            
            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4      # Set up Docker Buildx for building the application.

            - name: Log in to Docker Hub
              uses: docker/login-action@v4             # Log in to Docker Hub using credentials stored
              with:
                  login: true                            # Enable login to Docker Hub
                  username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub username from GitHub Secrets
                  password: ${{ secrets.DOCKER_TOKEN }}  # Docker Hub token from GitHub Secrets

            - name: Build and push Docker image
              uses: docker/build-push-action@v7        # Build and push the Docker image to Docker Hub
              with:
                  push: true                         # Push the built image to Docker Hub
                  tags: user/app:latest              # Tag for the Docker image

            